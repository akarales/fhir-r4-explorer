services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8004"
    environment:
      APP_DEMO_BUNDLE: /app/demo_bundle.json
    volumes:
      - ./crates/api/tests/fixtures/demo_bundle.json:/app/demo_bundle.json:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3003:80"
    depends_on:
      - api
    restart: unless-stopped
